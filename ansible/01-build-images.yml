---
# 01-build-images.yml - Build Azure VHD images on both builder VMs in parallel
#
# Uses async to launch both builds concurrently from a single play,
# then waits for both to complete.

- name: Build Azure VHD Images (parallel)
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - vars.yml
    - .builder_ips.yml
  vars:
    ssh_opts: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    ssh9: "ssh {{ ssh_opts }} -i {{ builder_ssh_key }} builder@{{ rhel9_builder_ip }}"
    ssh10: "ssh {{ ssh_opts }} -i {{ builder_ssh_key }} builder@{{ rhel10_builder_ip }}"
    scp9: "scp {{ ssh_opts }} -i {{ builder_ssh_key }}"
    scp10: "scp {{ ssh_opts }} -i {{ builder_ssh_key }}"

  tasks:
    # --- One-time setup: ensure builder can use composer-cli without sudo ---
    - name: "[RHEL 9] Ensure builder user is in weldr group"
      ansible.builtin.command:
        cmd: "{{ ssh9 }} sudo usermod -a -G weldr builder"
      changed_when: true
      failed_when: false

    # --- Clean old artifacts to prevent disk-full failures ---
    - name: "[RHEL 9] Clean old composes and VHDs"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          {{ ssh9 }} "bash -c '
            for id in \$(composer-cli compose list 2>/dev/null | awk \"{print \\\$1}\"); do
              composer-cli compose delete \$id 2>/dev/null || true
            done
            rm -f ~/*-disk.vhd
          '"
        executable: /bin/bash
      changed_when: true
      failed_when: false

    - name: "[RHEL 10] Clean old build output"
      ansible.builtin.shell:
        cmd: |
          {{ ssh10 }} "sudo rm -rf /var/tmp/image-output /var/tmp/*-disk.vhd"
        executable: /bin/bash
      changed_when: true
      failed_when: false

    # --- Setup RHEL 9 builder and start compose ---
    - name: "[RHEL 9] Copy blueprint to builder"
      ansible.builtin.command:
        cmd: >-
          {{ scp9 }}
          {{ blueprints_dir }}/rhel9-azure-stig-fips.toml
          builder@{{ rhel9_builder_ip }}:~/rhel9-azure-stig-fips.toml
      changed_when: true

    - name: "[RHEL 9] Push blueprint and start compose"
      ansible.builtin.shell:
        cmd: |
          set -eo pipefail
          {{ ssh9 }} "
            composer-cli blueprints push ~/rhel9-azure-stig-fips.toml &&
            composer-cli blueprints depsolve rhel9-azure-stig-fips &&
            composer-cli compose start rhel9-azure-stig-fips vhd
          "
        executable: /bin/bash
      register: rhel9_compose_out
      changed_when: true

    - name: "[RHEL 9] Extract compose ID"
      ansible.builtin.set_fact:
        rhel9_compose_id: "{{ rhel9_compose_out.stdout | regex_search('[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}') }}"

    - name: "[RHEL 9] Display compose ID"
      ansible.builtin.debug:
        msg: "RHEL 9 compose started: {{ rhel9_compose_id }}"

    # --- Start RHEL 10 build (async - runs in background) ---
    - name: "[RHEL 10] Copy blueprint to builder"
      ansible.builtin.command:
        cmd: >-
          {{ scp10 }}
          {{ blueprints_dir }}/rhel10-stig-fips.toml
          builder@{{ rhel10_builder_ip }}:~/rhel10-stig-fips.toml
      changed_when: true

    # image-builder build needs root: it uses loopback devices and mount
    # which aren't namespace-able in the kernel.
    - name: "[RHEL 10] Start image-builder build (async)"
      ansible.builtin.shell:
        cmd: |
          {{ ssh10 }} "sudo image-builder build vhd \
            --blueprint ~/rhel10-stig-fips.toml \
            --output-dir /var/tmp/image-output \
            --ignore-warnings"
        executable: /bin/bash
      async: 3600
      poll: 0
      register: rhel10_build_async

    # --- Poll RHEL 9 compose status ---
    - name: "[RHEL 9] Wait for compose to finish (up to 60 minutes)"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          {{ ssh9 }} "composer-cli compose status" | grep '{{ rhel9_compose_id }}' | awk '{print $2}'
        executable: /bin/bash
      register: rhel9_status
      until: rhel9_status.stdout | trim in ['FINISHED', 'FAILED']
      retries: 120
      delay: 30
      changed_when: false

    - name: "[RHEL 9] Fail if compose failed"
      ansible.builtin.fail:
        msg: "RHEL 9 compose FAILED. Check: composer-cli compose log {{ rhel9_compose_id }}"
      when: rhel9_status.stdout | trim == 'FAILED'

    # --- Wait for RHEL 10 async build ---
    - name: "[RHEL 10] Wait for image-builder to finish"
      ansible.builtin.async_status:
        jid: "{{ rhel10_build_async.ansible_job_id }}"
      register: rhel10_result
      until: rhel10_result.finished
      retries: 120
      delay: 30

    - name: "[RHEL 10] Display build result"
      ansible.builtin.debug:
        msg: "RHEL 10 build completed (rc={{ rhel10_result.rc | default('?') }})"

    # --- Fetch VHDs ---
    - name: Create output directory
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"

    - name: "[RHEL 9] Fetch VHD from builder (async)"
      ansible.builtin.shell:
        cmd: |
          set -eo pipefail
          {{ ssh9 }} "cd ~ && rm -f {{ rhel9_compose_id }}-disk.vhd && composer-cli compose image {{ rhel9_compose_id }}"
          {{ scp9 }} \
            builder@{{ rhel9_builder_ip }}:~/{{ rhel9_compose_id }}-disk.vhd \
            {{ output_dir }}/rhel9-azure-stig-fips.vhd
        executable: /bin/bash
      async: 1800
      poll: 0
      register: rhel9_fetch_async

    - name: "[RHEL 10] Fetch VHD from builder (async)"
      ansible.builtin.shell:
        cmd: |
          set -eo pipefail
          {{ ssh10 }} "sudo chmod 755 /var/tmp/image-output && sudo chmod 644 /var/tmp/image-output/*.vhd"
          VHD_NAME=$({{ ssh10 }} "ls -t /var/tmp/image-output/*.vhd 2>/dev/null | head -n1" | tr -d '\r\n')
          {{ scp10 }} \
            builder@{{ rhel10_builder_ip }}:"$VHD_NAME" \
            {{ output_dir }}/rhel10-azure-stig-fips.vhd
        executable: /bin/bash
      async: 1800
      poll: 0
      register: rhel10_fetch_async

    - name: "[RHEL 9] Wait for VHD fetch"
      ansible.builtin.async_status:
        jid: "{{ rhel9_fetch_async.ansible_job_id }}"
      register: rhel9_fetch
      until: rhel9_fetch.finished
      retries: 60
      delay: 30

    - name: "[RHEL 10] Wait for VHD fetch"
      ansible.builtin.async_status:
        jid: "{{ rhel10_fetch_async.ansible_job_id }}"
      register: rhel10_fetch
      until: rhel10_fetch.finished
      retries: 60
      delay: 30

    - name: Display results
      ansible.builtin.debug:
        msg: |-
          VHDs built successfully:
            RHEL 9:  {{ output_dir }}/rhel9-azure-stig-fips.vhd
            RHEL 10: {{ output_dir }}/rhel10-azure-stig-fips.vhd

          Next: ./run.sh 02-azure-upload.yml  (or: ./run.sh terraform apply)
